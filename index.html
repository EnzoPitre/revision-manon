<title>Le Mur de Manon</title>
<meta name="theme-color" content="#F6F5FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@500;700&display=swap">
<style>
:root{
  /* Layout : une app-carnet. Fiches bristol épinglées sur papier quadrillé ; onglets en bas sur téléphone, en haut sur ordinateur. */
  --paper:#F6F5FB; --paper-deep:#ECEAF6; --card:#FFFFFF;
  --grid:rgba(98,88,190,.10); --card-grid:rgba(98,88,190,.085);
  --ink:#1C1B2B; --ink-soft:#55536F; --ink-faint:#8A87A6; --rule:#DDDAEC;
  --pen:#2D3E9F; --pen-green:#13755A; --pen-red:#C3283A;
  --stabilo:rgba(205,112,232,.32); --veil:#D9C6EE;
  --postit:#F5EF86; --postit-ink:#2E3410; --tape:rgba(214,206,170,.55);
  --c-ophtalmo:#2F6BD6; --c-orl:#B9680B; --c-pneumo:#0E837F; --c-psy:#7B4AD0; --c-rea:#CF3346; --c-pink:#C2407A; --c-olive:#5F7F12;
  --good:#1B8456; --good-bg:#DDF3E8; --bad:#C3283A; --bad-bg:#FBE1E4;
  --shadow:0 1px 0 rgba(28,27,43,.05), 0 8px 20px -10px rgba(40,30,110,.28);
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#13122A; --paper-deep:#1A1935; --card:#1F1E3C;
    --grid:rgba(160,150,255,.07); --card-grid:rgba(160,150,255,.06);
    --ink:#EDECFA; --ink-soft:#B0AED0; --ink-faint:#7F7CA3; --rule:#33315A;
    --pen:#9DB0FF; --pen-green:#62D4A8; --pen-red:#FF7D88;
    --stabilo:rgba(200,120,240,.30); --veil:#4B3C6E;
    --postit:#4C4920; --postit-ink:#F6F0A6; --tape:rgba(120,115,90,.45);
    --c-ophtalmo:#7EA8FF; --c-orl:#F2A54A; --c-pneumo:#4FD0C8; --c-psy:#B79BFF; --c-rea:#FF7F8E; --c-pink:#FF8DB8; --c-olive:#A9CF55;
    --good:#5CD49A; --good-bg:#173B2E; --bad:#FF7D88; --bad-bg:#45202A;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#13122A; --paper-deep:#1A1935; --card:#1F1E3C;
  --grid:rgba(160,150,255,.07); --card-grid:rgba(160,150,255,.06);
  --ink:#EDECFA; --ink-soft:#B0AED0; --ink-faint:#7F7CA3; --rule:#33315A;
  --pen:#9DB0FF; --pen-green:#62D4A8; --pen-red:#FF7D88;
  --stabilo:rgba(200,120,240,.30); --veil:#4B3C6E;
  --postit:#4C4920; --postit-ink:#F6F0A6; --tape:rgba(120,115,90,.45);
  --c-ophtalmo:#7EA8FF; --c-orl:#F2A54A; --c-pneumo:#4FD0C8; --c-psy:#B79BFF; --c-rea:#FF7F8E; --c-pink:#FF8DB8; --c-olive:#A9CF55;
  --good:#5CD49A; --good-bg:#173B2E; --bad:#FF7D88; --bad-bg:#45202A;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font:16px/1.5 var(--f-body); color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  min-height:100%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--pen);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand-tag{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:15px;letter-spacing:.04em;background:var(--card);border:1px solid var(--rule);padding:3px 9px;transform:rotate(-2deg);display:inline-block;box-shadow:var(--shadow)}
.brand-name{font-family:var(--f-hand);font-size:26px;font-weight:700;color:var(--pen-red);line-height:1}
.nav-top{display:none;gap:4px}
.nav-top button,.nav-bot button{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-weight:700;font-size:14px;border-radius:8px}
.nav-top button{padding:8px 12px}
.nav-top button[aria-current="page"]{color:var(--ink);background:var(--card);box-shadow:var(--shadow)}
.nav-top button:hover{color:var(--ink)}
.nav-bot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-bot button{flex-direction:column;gap:2px;padding:6px 0;font-size:11.5px;align-items:center}
.nav-bot button[aria-current="page"]{color:var(--pen)}
.nav-bot button[aria-current="page"] svg{stroke-width:2.2}
main{max-width:1080px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:860px){
  .nav-top{display:flex}
  .nav-bot{display:none}
  main{padding-bottom:64px;padding-top:28px}
}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-soft)}
.hand{font-family:var(--f-hand);font-weight:700;color:var(--pen-red);line-height:1.1}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-faint)}
.sec-title{font-size:22px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-title .hand{font-size:22px;font-weight:500}

/* ---------- paper objects ---------- */
.paper{
  background-color:var(--card);
  background-image:linear-gradient(var(--card-grid) 1px,transparent 1px),linear-gradient(90deg,var(--card-grid) 1px,transparent 1px);
  background-size:18px 18px;background-position:-1px -1px;
  border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow);
}
.plain{background:var(--card);border:1px solid var(--rule);border-radius:12px}
.tag{display:inline-flex;align-items:baseline;gap:10px;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:8px 16px;transform:rotate(-1.2deg);font-size:clamp(20px,4.6vw,30px);line-height:1.1}
.tag .num{color:var(--spec,var(--ink))}
.tape{position:relative}
.tape::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(-3deg);background:var(--tape);border-radius:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;padding:11px 18px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:15px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--rule)}
.btn.small{padding:7px 12px;font-size:13.5px;border-radius:8px}
.btn.on{background:var(--good-bg);color:var(--good);border-color:transparent}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-weight:700;font-size:14px}
.back:hover{color:var(--ink)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--rule);background:var(--card);font-weight:700;font-size:14px;color:var(--ink-soft)}
.chip svg.i{width:18px;height:18px;color:var(--spec,var(--ink-soft))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] svg.i{color:var(--paper)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--paper-deep);color:var(--ink-soft)}
.pill.ok{background:var(--good-bg);color:var(--good)}
.pill svg.i{width:14px;height:14px}
.bar{height:7px;border-radius:99px;background:var(--paper-deep);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--spec,var(--pen));transition:width .5s}

/* ---------- home ---------- */
.hero{display:grid;gap:20px}
@media (min-width:860px){.hero{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}}
.count{padding:30px 22px 22px;text-align:center;margin-top:10px}
.count .big{font-family:var(--f-display);font-weight:800;font-size:clamp(84px,24vw,136px);line-height:.9;color:var(--pen-red);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.count .sub{font-size:28px;margin-top:6px}
.count label{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;font-size:14px;color:var(--ink-soft);flex-wrap:wrap}
.count input{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:5px 8px}
.plan{padding:20px}
.plan ol{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.plan li button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:8px}
.plan li button:hover{background:var(--paper-deep)}
.plan .n{font-family:var(--f-display);font-weight:800;min-width:46px;color:var(--spec);font-variant-numeric:tabular-nums}
.plan .t{flex:1;font-weight:700}
.specs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.spec-tile{padding:16px;display:flex;flex-direction:column;gap:10px}
.spec-tile:hover{transform:translateY(-2px)}
.spec-tile{transition:transform .15s}
.spec-tile .hd{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px}
.spec-tile .hd svg.i{width:28px;height:28px;color:var(--spec)}
.spec-tile small{color:var(--ink-soft);font-size:13px;font-variant-numeric:tabular-nums}
.modes{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.mode{padding:16px;display:flex;gap:14px;align-items:flex-start;transition:transform .15s}
.mode:hover{transform:translateY(-2px)}
.mode .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--paper-deep);color:var(--pen);flex:none}
.mode h3{font-size:17px;font-weight:700}
.mode p{margin:3px 0 0;color:var(--ink-soft);font-size:14px;line-height:1.4}
.mode .best{margin-top:8px}
.foot{font-size:13px;color:var(--ink-faint);text-align:center;padding-top:8px}
.foot a{color:var(--pen);font-weight:700}
</style>
<style>
/* ---------- fiches list ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:0 12px}
.search input{flex:1;border:0;background:none;padding:11px 0;outline:none;min-width:0}
.search svg.i{color:var(--ink-faint)}
.flist{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.ftile{padding:14px 16px 14px;display:flex;flex-direction:column;gap:6px;min-height:118px;transition:transform .15s}
.ftile:hover{transform:translateY(-2px) rotate(-.4deg)}
.ftile .top-l{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ftile .num{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--spec)}
.ftile .num svg.i{display:none}
.ftile .ttl{font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.02em;line-height:1.2}
.ftile .meta{margin-top:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--ink-soft)}

/* ---------- fiche ---------- */
.fhead{display:flex;flex-direction:column;gap:14px}
.factions{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--ink-soft);display:flex;gap:8px;align-items:center}
.wall{columns:310px;column-gap:18px}
.card{break-inside:avoid;display:inline-block;width:100%;margin:0 0 18px;padding:16px 18px 14px}
.card h3{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:2px}
.card .csub{font-size:13.5px;color:var(--ink-soft);font-style:italic}
.card ul{list-style:none;margin:8px 0 0;padding:0;color:var(--pen);display:flex;flex-direction:column;gap:3px}
.card ul ul{margin:3px 0 4px 16px;font-size:15px}
.card li{position:relative;padding-left:16px;line-height:1.42}
.card li::before{content:"–";position:absolute;left:0;color:var(--ink-faint)}
.card li.sub{padding-left:0;color:var(--ink);font-weight:700;margin-top:6px}
.card li.sub::before{content:none}
.card li.sub:first-child{margin-top:0}
.card.postit{background:var(--postit);background-image:none;border-color:transparent;transform:rotate(.6deg);border-radius:2px}
.card.postit,.card.postit h3,.card.postit ul,.card.postit li.sub{color:var(--postit-ink)}
.card.postit li::before{color:var(--postit-ink)}
mark.k{background:linear-gradient(transparent 38%,var(--stabilo) 38%,var(--stabilo) 92%,transparent 92%);color:inherit;padding:0 2px;border-radius:2px}
b.n{color:var(--pen-green);font-weight:700;font-variant-numeric:tabular-nums}
.r{color:var(--pen-red);font-weight:700}
.hide mark.k:not(.on),.hide b.n:not(.on){color:transparent;background:var(--veil);border-radius:4px;cursor:pointer;user-select:none;-webkit-user-select:none}
.hide mark.k.on,.hide b.n.on{animation:pop .25s ease}
@keyframes pop{from{background-color:var(--veil)}}
.tbl{overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;font-size:14px;min-width:100%;color:var(--pen)}
.tbl th,.tbl td{border:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{color:var(--ink);font-weight:700;background:var(--paper-deep);font-size:13px}
.tbl td:first-child{color:var(--ink);font-weight:700}
.wave{display:block;width:150px;max-width:100%;height:30px;color:var(--pen-red);margin:2px 0 4px}
.fnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px dashed var(--rule);padding-top:16px}

/* ---------- jeux ---------- */
.game{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ghead .prog{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.gtitle{font-size:24px;font-weight:800}
.from{font-size:13px;color:var(--ink-soft);display:inline-flex;gap:6px;align-items:center;font-weight:700}
.from i{width:9px;height:9px;border-radius:50%;background:var(--spec);display:inline-block}
.flip{perspective:1400px;width:100%}
.flip .inner{display:grid;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.flip .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:30px 24px;min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.flip .back{transform:rotateY(180deg)}
.flip .q{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,5vw,26px);line-height:1.25}
.flip .a{font-size:clamp(18px,4.4vw,21px);color:var(--pen);font-weight:700;line-height:1.4}
.flip .lbl{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-faint)}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigbtn{padding:15px 12px;border-radius:12px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--rule);background:var(--card)}
.bigbtn.ko{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.bigbtn.okb{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.bigbtn:active{transform:scale(.98)}
.qcard{padding:24px 20px}
.qcard .q{font-family:var(--f-display);font-weight:700;font-size:clamp(19px,4.8vw,24px);line-height:1.3}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{padding:14px 16px;border-radius:12px;border:1.5px solid var(--rule);background:var(--card);font-weight:700;color:var(--pen);display:flex;gap:12px;align-items:center;transition:background .15s,border-color .15s}
.opt .l{font-family:var(--f-display);color:var(--ink-faint);font-weight:800;width:18px;flex:none}
.opt:not([disabled]):hover{border-color:var(--pen)}
.opt.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.timer{height:8px;border-radius:99px;background:var(--paper-deep);overflow:hidden}
.timer>i{display:block;height:100%;background:var(--pen-red);transition:width 1s linear}
.vf{padding:28px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;transition:box-shadow .2s}
.vf .ctx{font-size:15px;color:var(--ink-soft);font-weight:700}
.vf .prop{font-family:var(--f-display);font-weight:700;font-size:clamp(21px,5.4vw,28px);color:var(--pen);line-height:1.25}
.vf.flash-ok{box-shadow:0 0 0 3px var(--good)}
.vf.flash-ko{box-shadow:0 0 0 3px var(--bad)}
.score-line{display:flex;justify-content:space-between;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.assoc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.assoc .col{display:flex;flex-direction:column;gap:8px}
.as{padding:11px 10px;border-radius:10px;border:1.5px solid var(--rule);background:var(--card);font-weight:700;font-size:14px;line-height:1.3;min-height:52px;display:flex;align-items:center;transition:all .15s}
.as.R{color:var(--pen)}
.as.sel{border-color:var(--pen);background:color-mix(in srgb,var(--pen) 10%,var(--card))}
.as.done{background:var(--good-bg);border-color:transparent;color:var(--good);opacity:.75}
.as.wrong{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.tri-item{padding:30px 22px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:clamp(21px,5.4vw,27px);color:var(--pen);min-height:130px;display:grid;place-items:center}
.cats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.cat{padding:16px 12px;border-radius:12px;border:1.5px solid var(--rule);background:var(--card);font-weight:700;text-align:center}
.cat.good{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.cat.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.ord{display:flex;flex-direction:column;gap:8px}
.ordi{padding:13px 14px;border-radius:12px;border:1.5px solid var(--rule);background:var(--card);font-weight:700;display:flex;gap:12px;align-items:center;color:var(--pen)}
.ordi .k{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;background:var(--paper-deep);color:var(--ink-faint)}
.ordi.done{background:var(--good-bg);border-color:transparent;color:var(--good)}
.ordi.done .k{background:var(--good);color:var(--card)}
.ordi .det{margin-left:auto;font-size:13px;font-weight:700;color:var(--good);text-align:right}
.ordi.wrong{animation:shake .35s;border-color:var(--bad)}
.setlist{display:flex;flex-direction:column;gap:8px}
.setb{padding:14px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;border-radius:12px}
.setb .t{font-weight:700}
.end{padding:30px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.end .sc{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,18vw,96px);line-height:1;color:var(--pen-red);font-variant-numeric:tabular-nums}
.end .msg{font-size:30px}
.wrongs{display:flex;flex-direction:column;gap:8px}
.wr{padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.wr .q{font-weight:700;font-size:14.5px}
.wr .a{color:var(--pen);font-weight:700}
.wr button{align-self:flex-start}

/* ---------- progrès ---------- */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.kpis{grid-template-columns:1fr 1fr}.kpis>:last-child{grid-column:1/-1}}
.kpi{padding:16px}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13.5px;color:var(--ink-soft);font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);font-weight:700}
.week .dot{width:100%;max-width:46px;aspect-ratio:1;border-radius:10px;background:var(--paper-deep);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--card);font-size:14px;font-variant-numeric:tabular-nums}
.ptable{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:120px 1fr 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--rule)}
.prow:last-child{border-bottom:0}
.prow .nm{display:flex;align-items:center;gap:8px;font-weight:700}
.prow .nm svg.i{color:var(--spec)}
.prow .cell{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
@media (max-width:520px){.prow{grid-template-columns:1fr 1fr}.prow .nm{grid-column:1/-1}}
.records{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.rec{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.rec b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.box{padding:18px}
.danger{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
const CARDS = [];
GROUPS.forEach(g => g.pairs.forEach(p => CARDS.push({id:"g"+hash(g.id+p[0]), item:p[2]||g.item, q:g.q.replace("{k}",p[0]), a:p[1]})));
FLASH.forEach(f => CARDS.push({id:"f"+hash(f[1]), item:f[0], q:f[1], a:f[2]}));

/* ---------- état sauvegardé ---------- */
const KEY = CONFIG.key;
const S = (() => {
  let d = {};
  try { d = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}
  return Object.assign({mastered:{}, box:{}, best:{}, days:{}, exam:null, filter:"all"}, d);
})();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return iso(new Date()); }
if (!S.exam) { const d = new Date(); d.setDate(d.getDate()+7); S.exam = iso(d); save(); }
function daysLeft(){ return Math.round((new Date(S.exam+"T00:00") - new Date(today()+"T00:00")) / 864e5); }
function tick(){ const t = today(); S.days[t] = (S.days[t]||0) + 1; save(); }
function saveBest(mode, v){ if (!(S.best[mode] >= v)) S.best[mode] = v; save(); }
function streak(){
  let n = 0; const d = new Date();
  if (!S.days[iso(d)]) d.setDate(d.getDate()-1);
  while (S.days[iso(d)]) { n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $("#app");
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(s){
  return esc(s).replace(/==(.+?)==/g,'<mark class="k">$1</mark>')
    .replace(/\+\+(.+?)\+\+/g,'<b class="n">$1</b>')
    .replace(/!!(.+?)!!/g,'<span class="r">$1</span>');
}
function plain(s){ return String(s).replace(/==|\+\+|!!|§/g,""); }
function norm(s){ return plain(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase(); }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function specOf(itemId){ return ITEM_BY[itemId] ? ITEM_BY[itemId].spec : "rea"; }
function specVar(spec){ return `--spec:var(${SPECS[spec] ? SPECS[spec].c : "--pen"})`; }
function pass(itemId, only){ if (only) return itemId === only; return S.filter === "all" || specOf(itemId) === S.filter; }
function fromLabel(itemId){
  const it = ITEM_BY[itemId]; if (!it) return "";
  return `<button class="from" style="${specVar(it.spec)}" data-go="fiche:${it.id}"><i></i>Fiche ${esc(it.num)} · ${esc(it.title)}</button>`;
}
function itemText(it){
  const out = [it.title];
  const walk = a => a.forEach(x => Array.isArray(x) ? walk(x) : out.push(x));
  it.cards.forEach(c => { out.push(c.h); if (c.l) walk(c.l); if (c.table) c.table.rows.forEach(r => out.push(r.join(" "))); });
  return norm(out.join(" "));
}
const SEARCH = {}; ITEMS.forEach(it => SEARCH[it.id] = itemText(it));
function cardsOfSpec(spec){ return CARDS.filter(c => !spec || specOf(c.item) === spec); }
function acquired(list){ return list.filter(c => (S.box[c.id]||0) >= 2).length; }

}

  return "le concours est passé";

/* ---------- FICHE ---------- */
function renderList(arr){
  let out = "<ul>";
  for (let i = 0; i < arr.length; i++) {
    const x = arr[i]; if (Array.isArray(x)) continue;
    const next = arr[i+1], sub = x.startsWith("§");
    out += `<li${sub?' class="sub"':""}>${fmt(sub ? x.slice(1) : x)}${Array.isArray(next) ? renderList(next) : ""}</li>`;
  }
  return out + "</ul>";
}
function respSvg(name){
  const W = 150, pts = [];
  for (let x = 0; x <= W; x++) {
    let y = 0;
    if (name === "Cheyne-Stokes") { const c = x % 75; const env = c < 55 ? Math.sin(Math.PI*c/55) : 0; y = env*11*Math.sin(x*.75); }
    else if (name === "Hyperpnée") y = 10*Math.sin(x*.55);
    else if (name === "Apneustique") { const s = Math.sin(x*.12); y = s > 0 ? 11*Math.min(1, s*2.4) : 11*s; }
    else if (name === "Kussmaul") y = 12*Math.sin(x*.2);
    else [8,22,27,51,70,77,104,128,135].forEach(s => { const d = Math.abs(x-s); if (d < 3) y += (3-d)/3*(s%2 ? 9 : 12); });
    pts.push(x + "," + (15 - y).toFixed(1));
  }
  return `<svg class="wave" viewBox="0 0 150 30" aria-hidden="true"><polyline points="${pts.join(" ")}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}
function cardHtml(c){
  let body = "";
  if (c.resp) body = `<ul>${c.l.map(n => `<li>${esc(n)}${respSvg(n)}</li>`).join("")}</ul>`;
  else if (c.l) body = renderList(c.l);
  if (c.table) body += `<div class="tbl"><table><thead><tr>${c.table.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${c.table.rows.map(r => `<tr>${r.map(x => `<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return `<article class="card ${c.tone === "postit" ? "postit" : "paper"}">
    <h3>${esc(c.h)}</h3>${c.sub ? `<div class="csub">${esc(c.sub)}</div>` : ""}${body}</article>`;
}

/* ---------- JEUX : hub ---------- */
function vJeux(){
  return `<div class="stack">
    <h1 class="sec-title" style="font-size:28px">Jeux <span class="hand">pour que ça rentre</span></h1>
    ${specChips(S.filter, "gspec")}
    ${modesGrid()}
  </div>`;
}

/* ---------- moteur des jeux ---------- */
function groupVals(g, only){
  const ps = g.pairs.filter(p => pass(p[2]||g.item, only));
  return {ps, vals:[...new Set(g.pairs.map(p => p[1]))]};
}
function startGame(mode, only){
  G = {mode, only, ok:0, err:0, wrong:[], over:false};
  if (mode === "flash") {
    const pool = CARDS.filter(c => pass(c.item, only));
    G.q = shuffle(pool).sort((a,b) => (S.box[a.id]||0) - (S.box[b.id]||0)).slice(0, 20).map(c => ({c, r:0}));
    G.total = G.q.length; G.i = 0; G.flipped = false;
  }
  else if (mode === "quiz") {
    const pool = [];
    GROUPS.forEach(g => { const {ps, vals} = groupVals(g, only); if (vals.length >= 3) ps.forEach(p => pool.push({g, p, vals})); });
    G.qs = shuffle(pool).slice(0, 10).map(({g,p,vals}) => ({
      q:g.q.replace("{k}", p[0]), a:p[1], item:p[2]||g.item,
      opts:shuffle([p[1], ...shuffle(vals.filter(v => v !== p[1])).slice(0,3)])
    }));
    G.i = 0; G.pick = null;
  }
  else if (mode === "vf") {
    G.pool = [];
    GROUPS.forEach(g => { const {ps, vals} = groupVals(g, only); if (vals.length >= 2) ps.forEach(p => G.pool.push({g, p, vals})); });
    G.t = 60; G.streak = 0; G.bestStreak = 0; G.deck = [];
    if (G.pool.length) { vfNext(); G.timer = setInterval(vfTick, 1000); }
  }
  else if (mode === "assoc") { G.round = 0; G.used = []; assocRound(); }
  else if (mode === "tri" || mode === "ordre") G.stage = "pick";
}
function setsFor(list){ return list.filter(s => pass(s.item, G.only) || (!G.only && S.filter === "all")); }

/* VF */
function vfNext(){
  if (!G.deck.length) G.deck = shuffle(G.pool);
  const e = G.deck.pop(), truth = Math.random() < .5;
  const others = e.vals.filter(v => v !== e.p[1]);
  G.cur = {ctx:e.g.q.replace("{k}", e.p[0]), shown: truth || !others.length ? e.p[1] : pick(others), truth: truth || !others.length, a:e.p[1], item:e.p[2]||e.g.item};
}
function vfTick(){
  G.t--;
  const t = $("#vf-t"), b = $("#vf-bar");
  if (t) t.textContent = G.t;
  if (b) b.style.width = (G.t/60*100) + "%";
  if (G.t <= 0) { clearTimer(); G.over = true; saveBest("vf", G.ok); render(); }
}

/* Associations */
function assocRound(){
  const ok = GROUPS.filter(g => {
    const {ps} = groupVals(g, G.only);
    return new Set(ps.map(p => p[1])).size >= 4 && ps.every(p => p[0].length <= 60 && p[1].length <= 60);
  });
  let pool = ok.filter(g => !G.used.includes(g.id)); if (!pool.length) pool = ok;
  if (!pool.length) { G.none = true; return; }
  const g = pick(pool); G.used.push(g.id);
  const seen = new Set();
  G.g = g;
  G.ps = shuffle(groupVals(g, G.only).ps).filter(p => !seen.has(p[1]) && seen.add(p[1])).slice(0, 5);
  G.L = shuffle(G.ps.map((_, i) => i)); G.Rr = shuffle(G.ps.map((_, i) => i));
  G.done = []; G.sel = null; G.bad = null;
}

/* ---------- vues de jeu ---------- */
function gHead(title, prog){
  return `<div class="ghead"><button class="back" data-go="jeux">${I.left} Jeux</button>${prog ? `<span class="prog">${prog}</span>` : ""}</div>

}
function emptyGame(title){
  return `<div class="game">${gHead(title)}<div class="plain empty">Pas assez de contenu pour ce filtre. Choisis « Toutes » dans les jeux ou une autre spécialité.</div></div>`;
}
function verdict(p){
  if (p >= 90) return "Parfait, rien à redire.";
  if (p >= 70) return "Très solide.";
  if (p >= 50) return "Ça rentre. Encore un tour ?";
  return "On relit la fiche et on recommence.";
}
function vEnd(title, big, pct, extra){
  const replay = `play:${G.mode}${G.only ? ":" + G.only : ""}`;
  return `<div class="game">${gHead(title)}
    <div class="paper end tape"><div class="sc">${big}</div><div class="hand msg">${verdict(pct)}</div>${extra || ""}
      <div class="row" style="justify-content:center;margin-top:8px">
        <button class="btn" data-go="${replay}">Rejouer</button>
        <button class="btn ghost" data-go="jeux">Autre jeu</button></div></div>
    ${G.wrong.length ? `<h2 class="sec-title">À revoir <span class="hand">${G.wrong.length}</span></h2>
      <div class="wrongs">${G.wrong.map(w => `<div class="plain wr"><span class="q">${esc(w.q)}</span><span class="a">${esc(w.a)}</span>${fromLabel(w.item)}</div>`).join("")}</div>` : ""}
  </div>`;
}
function vGame(){
  if (!G) return vJeux();
  const m = MODES.find(x => x.id === G.mode);
  const title = m.name + (G.only ? ` · fiche ${ITEM_BY[G.only].num}` : S.filter !== "all" ? ` · ${SPECS[S.filter].name}` : "");
  return ({flash:gFlash, quiz:gQuiz, vf:gVf, assoc:gAssoc, tri:gTri, ordre:gOrdre})[G.mode](title);
}
function gFlash(title){
  if (!G.total) return emptyGame(title);
  if (G.i >= G.q.length) {
    const pct = Math.round(G.ok / Math.max(1, G.ok + G.err) * 100);
    saveBest("flash", pct);
    return vEnd(title, `${G.ok}<small style="font-size:.4em"> / ${G.ok + G.err}</small>`, pct, `<p class="muted">Bonnes réponses du premier coup ou après révision dans cette session.</p>`);
  }
  const {c} = G.q[G.i], box = S.box[c.id] || 0;
  return `<div class="game">${gHead(title, `${G.i+1} / ${G.q.length}`)}
    ${fromLabel(c.item)}
    <button class="flip ${G.flipped ? "flipped" : ""}" data-act="flip" aria-label="Retourner la carte">
      <div class="inner">
        <div class="face paper"><span class="lbl">Question · boîte ${box}</span><div class="q">${esc(c.q)}</div><span class="muted" style="font-size:14px">Touche pour voir la réponse</span></div>
        <div class="face back paper"><span class="lbl">Réponse</span><div class="a">${esc(c.a)}</div></div>
      </div>
    </button>
    ${G.flipped ? `<div class="twobtn">
      <button class="bigbtn ko" data-act="fc" data-v="0">${I.x} À revoir</button>
      <button class="bigbtn okb" data-act="fc" data-v="1">${I.check} Je savais</button></div>`
      : `<p class="muted" style="text-align:center;font-size:14px;margin:0">Réponds dans ta tête, puis retourne la carte.</p>`}
  </div>`;
}
function gQuiz(title){
  if (!G.qs.length) return emptyGame(title);
  if (G.i >= G.qs.length) {
    const pct = Math.round(G.ok / G.qs.length * 100); saveBest("quiz", pct);
    return vEnd(title, `${G.ok}<small style="font-size:.4em"> / ${G.qs.length}</small>`, pct);
  }
  const q = G.qs[G.i], L = "ABCD";
  return `<div class="game">${gHead(title, `${G.i+1} / ${G.qs.length}`)}
    <div class="paper qcard"><div class="q">${esc(q.q)}</div></div>
    <div class="opts">${q.opts.map((o, i) => {
      let cls = "";
      if (G.pick != null) { if (o === q.a) cls = "good"; else if (i === G.pick) cls = "bad"; }
      return `<button class="opt ${cls}" data-act="qo" data-i="${i}" ${G.pick != null ? "disabled" : ""}><span class="l">${L[i]}</span>${esc(o)}</button>`;
    }).join("")}</div>
    ${G.pick != null ? `<div class="row" style="justify-content:space-between">${fromLabel(q.item)}<button class="btn" data-act="qnext">${G.i+1 < G.qs.length ? "Suivante" : "Voir le score"} ${I.right}</button></div>` : ""}
  </div>`;
}
function gVf(title){
  if (!G.pool.length) return emptyGame(title);
  if (G.over) return vEnd(title, `${G.ok}<small style="font-size:.4em"> pts</small>`, Math.round(G.ok / Math.max(1, G.ok + G.err) * 100),
    `<p class="muted">${G.ok} bonnes, ${G.err} erreurs · meilleure série : ${G.bestStreak}</p>`);
  const c = G.cur;
  return `<div class="game">${gHead(title, `<span id="vf-t">${G.t}</span> s`)}
    <div class="timer"><i id="vf-bar" style="width:${G.t/60*100}%"></i></div>
    <div class="score-line"><span>${G.ok} pts</span><span class="muted">série ${G.streak}</span></div>
    <div class="paper vf ${G.fb ? "flash-" + G.fb : ""}">
      <div class="ctx">${esc(c.ctx)}</div>
      <div class="prop">${esc(c.shown)}</div>
    </div>
    <div class="twobtn">
      <button class="bigbtn ko" data-act="vf" data-v="0">${I.x} Faux</button>
      <button class="bigbtn okb" data-act="vf" data-v="1">${I.check} Vrai</button>
    </div>
  </div>`;
}
function gAssoc(title){
  if (G.none) return emptyGame(title);
  if (G.over) { const pct = Math.round(G.ok / Math.max(1, G.ok + G.err) * 100); saveBest("assoc", pct);
    return vEnd(title, pct + "<small style='font-size:.4em'> %</small>", pct, `<p class="muted">${G.ok} paires trouvées, ${G.err} erreurs</p>`); }
  const cell = (side, i, txt) => {
    const done = G.done.includes(i), sel = G.sel && G.sel.s === side && G.sel.i === i, bad = G.bad && G.bad[side] === i;
    return `<button class="as ${side} ${done ? "done" : ""} ${sel ? "sel" : ""} ${bad ? "wrong" : ""}" data-act="as" data-s="${side}" data-i="${i}" ${done ? "disabled" : ""}>${esc(txt)}</button>`;
  };
  return `<div class="game">${gHead(title, `Manche ${G.round+1} / 3`)}
    <div class="row" style="justify-content:space-between"><span class="muted" style="font-weight:700">${esc(G.g.q.replace("{k}", "…"))}</span>${fromLabel(G.g.item)}</div>
    <div class="assoc">
      <div class="col">${G.L.map(i => cell("L", i, G.ps[i][0])).join("")}</div>
      <div class="col">${G.Rr.map(i => cell("R", i, G.ps[i][1])).join("")}</div>
    </div>
  </div>`;
}
function setPicker(title, list, kind){
  const sets = setsFor(list);
  if (!sets.length) return emptyGame(title);
  return `<div class="game">${gHead(title)}
    <p class="muted" style="margin:0">Choisis une série.</p>
    <div class="setlist">${sets.map(s => `<button class="plain setb" style="${specVar(specOf(s.item))}" data-act="pickset" data-id="${s.id}">
      <span class="t">${esc(s.title)}</span><span class="pill">${SPECS[specOf(s.item)].name}</span></button>`).join("")}
      <button class="plain setb" data-act="pickset" data-id="*"><span class="t">Au hasard</span>${I.dice}</button></div>
  </div>`;
}
function gTri(title){
  if (G.stage === "pick") return setPicker(title, TRIS);
  if (G.i >= G.items.length) { const pct = Math.round(G.ok / G.items.length * 100); saveBest("tri", pct);
    return vEnd(title, `${G.ok}<small style="font-size:.4em"> / ${G.items.length}</small>`, pct); }
  const cur = G.items[G.i], cats = Object.keys(G.set.cats);
  return `<div class="game">${gHead(esc(G.set.title), `${G.i+1} / ${G.items.length}`)}
    ${fromLabel(G.set.item)}
    <div class="paper tri-item">${esc(cur.t)}</div>
    <div class="cats">${cats.map(c => {
      let cls = ""; if (G.fb) { if (c === cur.c) cls = "good"; else if (c === G.fb) cls = "bad"; }
      return `<button class="cat ${cls}" data-act="tri" data-c="${esc(c)}">${esc(c)}</button>`; }).join("")}</div>
  </div>`;
}
function gOrdre(title){
  if (G.stage === "pick") return setPicker(title, ORDRES);
  const seq = G.set.seq, finished = G.next >= seq.length;
  if (finished && G.over) { const pct = Math.round(seq.length / (seq.length + G.err) * 100); saveBest("ordre", pct);
    return vEnd(title, pct + "<small style='font-size:.4em'> %</small>", pct, `<p class="muted">${G.err} erreur${G.err>1?"s":""} sur « ${esc(G.set.title)} »</p>`); }
  return `<div class="game">${gHead(esc(G.set.title), `${G.next} / ${seq.length}`)}
    ${fromLabel(G.set.item)}
    <p class="muted" style="margin:0">Touche les éléments dans l'ordre.</p>
    <div class="ord">${G.order.map(i => {
      const pos = G.placed.indexOf(i), done = pos >= 0;
      return `<button class="ordi ${done ? "done" : ""} ${G.bad === i ? "wrong" : ""}" data-act="ord" data-i="${i}" ${done ? "disabled" : ""}>
        <span class="k">${done ? pos + 1 : ""}</span><span>${esc(seq[i][0])}</span>${done ? `<span class="det">${esc(seq[i][1])}</span>` : ""}</button>`;
    }).join("")}</div>
    ${finished ? `<button class="btn" data-act="ordend">Voir le score ${I.right}</button>` : ""}
  </div>`;
}

/* ---------- actions ---------- */
const ACT = {
  randomFiche(){ const pool = ITEMS.filter(i => !S.mastered[i.id]); go("fiche:" + pick(pool.length ? pool : ITEMS).id); },
  fspec(d){ R.spec = d.spec; render(); },
  gspec(d){ S.filter = d.spec; save(); render(); },
  hide(){ R.hide = !R.hide; render(); },
  master(){ S.mastered[R.id] = !S.mastered[R.id]; if (!S.mastered[R.id]) delete S.mastered[R.id]; else tick(); save(); render(); },
  reset(){
    if (!R.confirmReset) { R.confirmReset = true; render(); return; }
    const exam = S.exam;
    Object.assign(S, {mastered:{}, box:{}, best:{}, days:{}, exam, filter:"all"}); save();
    R.confirmReset = false; render();
  },
  flip(){ G.flipped = !G.flipped; render(); },
  fc(d){
    const e = G.q[G.i], id = e.c.id, known = d.v === "1";
    if (known) { S.box[id] = Math.min((S.box[id]||0) + 1, 5); if (!e.r) G.ok++; }
    else { S.box[id] = 0; if (!e.r) { G.err++; G.wrong.push({q:e.c.q, a:e.c.a, item:e.c.item}); } if (e.r < 2) G.q.push({c:e.c, r:e.r + 1}); }
    tick(); save(); G.i++; G.flipped = false; render();
  },
  qo(d){
    if (G.pick != null) return;
    G.pick = +d.i; const q = G.qs[G.i];
    if (q.opts[G.pick] === q.a) G.ok++; else { G.err++; G.wrong.push({q:q.q, a:q.a, item:q.item}); }
    tick(); render();
  },
  qnext(){ G.i++; G.pick = null; render(); },
  vf(d){
    if (G.over) return;
    const good = (d.v === "1") === G.cur.truth;
    if (good) { G.ok++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak); }
    else { G.err++; G.streak = 0; G.wrong.push({q:G.cur.ctx, a:G.cur.a, item:G.cur.item}); }
    G.fb = good ? "ok" : "ko"; tick(); vfNext(); render();
    setTimeout(() => { if (G && G.mode === "vf" && !G.over) { G.fb = null; const el = document.querySelector(".vf"); if (el) el.classList.remove("flash-ok","flash-ko"); } }, 260);
  },
  as(d){
    const side = d.s, i = +d.i; G.bad = null;
    if (!G.sel || G.sel.s === side) { G.sel = {s:side, i}; render(); return; }
    if (G.sel.i === i) { G.done.push(i); G.ok++; }
    else {
      G.err++;
      const li = side === "L" ? i : G.sel.i, ri = side === "R" ? i : G.sel.i;
      G.bad = {L:li, R:ri};
      G.wrong.push({q:G.g.q.replace("{k}", G.ps[li][0]), a:G.ps[li][1], item:G.ps[li][2]||G.g.item});
    }
    G.sel = null; tick();
    if (G.done.length === G.ps.length) {
      G.round++;
      if (G.round >= 3) G.over = true; else assocRound();
    }
    render();
  },
  pickset(d){
    const list = G.mode === "tri" ? TRIS : ORDRES;
    const sets = setsFor(list);
    G.set = d.id === "*" ? pick(sets) : list.find(s => s.id === d.id);
    G.stage = "play";
    if (G.mode === "tri") { G.items = shuffle(Object.entries(G.set.cats).flatMap(([c, xs]) => xs.map(t => ({t, c})))); G.i = 0; G.fb = null; }
    else { G.order = shuffle(G.set.seq.map((_, i) => i)); G.placed = []; G.next = 0; G.bad = null; }
    render();
  },
  tri(d){
    if (G.fb) return;
    const cur = G.items[G.i];
    G.fb = d.c;
    if (d.c === cur.c) G.ok++; else { G.err++; G.wrong.push({q:cur.t, a:cur.c, item:G.set.item}); }
    tick(); render();
    setTimeout(() => { if (G && G.mode === "tri") { G.i++; G.fb = null; render(); } }, d.c === cur.c ? 550 : 1100);
  },
  ord(d){
    const i = +d.i; G.bad = null;
    if (i === G.next) { G.placed.push(i); G.next++; }
    else { G.err++; G.bad = i; }
    tick(); render();
  },
  ordend(){ G.over = true; G.wrong = []; render(); }
};

document.addEventListener("click", e => {
  const m = e.target.closest(".hide mark.k, .hide b.n");
  if (m) { m.classList.toggle("on"); return; }
  const el = e.target.closest("[data-go],[data-act]");
  if (!el || el.disabled) return;
  if (el.dataset.go) { go(el.dataset.go); return; }
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el);
});
document.addEventListener("keydown", e => {
  if (R.v !== "game" || !G || e.target.matches("input")) return;
  if (G.mode === "flash" && G.i < G.q.length) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); ACT.flip(); }
    else if (G.flipped && e.key === "1") ACT.fc({v:"0"});
    else if (G.flipped && e.key === "2") ACT.fc({v:"1"});
  }
  if (G.mode === "vf" && !G.over) {
    if (e.key === "ArrowLeft") ACT.vf({v:"0"});
    if (e.key === "ArrowRight") ACT.vf({v:"1"});
  }
});
$("#brand-tag").textContent = CONFIG.brandTag; $("#brand-name").textContent = CONFIG.brandName;
render();
</script>
